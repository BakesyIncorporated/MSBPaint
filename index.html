<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MSBPaint</title>
  <link rel="stylesheet" href="/src/styles/reset.css" />
  <link rel="stylesheet" href="/src/styles/layout.css" />
  <link rel="stylesheet" href="/src/styles/toolbar.css" />
  <link rel="stylesheet" href="/src/styles/canvas.css" />
  <link rel="stylesheet" href="/src/styles/colour-palette.css" />
  <link rel="stylesheet" href="/src/styles/status-bar.css" />
</head>
<body>
  <div id="app">
    <header class="menu-bar">
      <button class="menu-item" data-menu="file">File</button>
      <button class="menu-item" data-menu="edit">Edit</button>
      <button class="menu-item" data-menu="image">Image</button>
      <button class="menu-item" data-menu="view">View</button>
      <button class="menu-item" data-menu="help">Help</button>
    </header>

    <div class="workspace">
      <aside class="toolbar" id="toolbar"></aside>

      <main class="canvas-area">
        <div class="canvas-wrapper" id="canvas-wrapper">
          <canvas id="paint-canvas"></canvas>
        </div>
      </main>
    </div>

    <footer class="bottom-bar">
      <div class="colour-palette" id="colour-palette"></div>
      <div class="status-bar" id="status-bar">
        <span class="status-coords" id="status-coords"></span>
        <span class="status-dimensions" id="status-dimensions"></span>
        <div class="status-zoom-controls">
          <button class="status-zoom-button" id="status-zoom-out" title="Zoom out">-</button>
          <span class="status-zoom" id="status-zoom"></span>
          <button class="status-zoom-button" id="status-zoom-in" title="Zoom in">+</button>
          <button class="status-zoom-button" id="status-zoom-reset" title="Reset zoom to 100%">100%</button>
        </div>
        <span class="status-tool" id="status-tool"></span>
      </div>
    </footer>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
